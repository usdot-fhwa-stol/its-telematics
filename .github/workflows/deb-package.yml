name: Telematics Deploy package

# Builds the Telematics Deploy Electron app (deployment/ui) into a .deb and
# keeps it as a build artifact (telematics-deploy-deb) on the workflow run.
# Download it from the run's summary page. Build artifacts expire, so for a tag
# on master the .deb is also attached to the tag's GitHub Release, where it is
# kept permanently.

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - develop
      - master
      - "release/*"
    tags:
      - "*"

jobs:
  git-revision-info-get:
    uses: usdot-fhwa-stol/actions/.github/workflows/git-revision-info.yml@main

  build-deb:
    needs: git-revision-info-get
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deployment/ui
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version-file: deployment/ui/.nvmrc
          cache: npm
          cache-dependency-path: deployment/ui/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Build .deb
        env:
          REVISION_INFO: ${{ needs.git-revision-info-get.outputs.git-revision-info }}
        run: |
          # Match the C++ packages' Debian version, <version>-<revision info>.
          # electron-builder turns a dash inside package.json's version into ~
          # (which sorts before <version>), so the revision info goes in as the
          # build number, which becomes the Debian revision instead.
          BUILD_ARGS=(--x64 --publish never)
          if [ -n "${REVISION_INFO}" ]; then
            BUILD_ARGS+=("-c.buildNumber=${REVISION_INFO}")
          fi
          npm run dist -- "${BUILD_ARGS[@]}"

          # Name the file the Debian way, like the C++ packages: <name>_<version>_<arch>.deb
          shopt -s nullglob
          debs=(release/*.deb)
          if [ "${#debs[@]}" -ne 1 ]; then
            echo "Expected one .deb in release/, found ${#debs[@]}"
            exit 1
          fi
          name=$(dpkg-deb -f "${debs[0]}" Package)
          version=$(dpkg-deb -f "${debs[0]}" Version)
          arch=$(dpkg-deb -f "${debs[0]}" Architecture)
          mv "${debs[0]}" "release/${name}_${version}_${arch}.deb"
          ls -l release/*.deb
      - name: Upload deb artifacts
        uses: actions/upload-artifact@v6
        with:
          name: telematics-deploy-deb
          path: deployment/ui/release/*.deb
          if-no-files-found: error

  github-release:
    if: github.ref_type == 'tag'
    needs: build-deb
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Checkout ${{ github.event.repository.name }}
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check the tag is on master
        id: on-master
        run: |
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "on_master=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Tag ${TAG} is not on master, so its .deb is only kept as a build artifact."
            echo "on_master=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Download deb artifacts
        if: steps.on-master.outputs.on_master == 'true'
        uses: actions/download-artifact@v6
        with:
          name: telematics-deploy-deb
          path: deb-packages
      - name: Attach .deb to the GitHub Release
        if: steps.on-master.outputs.on_master == 'true'
        run: |
          # Use the tag's release if one was already made (for example by hand
          # in GitHub), otherwise create it.
          if ! gh release view "${TAG}" > /dev/null 2>&1; then
            gh release create "${TAG}" --verify-tag --title "${TAG}" --notes "Release ${TAG}"
          fi
          gh release upload "${TAG}" deb-packages/*.deb --clobber
