name: Docker build
on:
  pull_request:
    branches:
      - develop
      - master
      - 'release/**'
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  determine_docker_org_and_tag:
    runs-on: ubuntu-latest
    outputs:
      docker_organization: ${{ steps.docker-org-and-tag.outputs.docker_organization }}
      docker_image_tag: ${{ steps.docker-org-and-tag.outputs.docker_image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: docker-org-and-tag
        uses: usdot-fhwa-stol/actions/docker-org-and-tag@main

  # Detect changed image directories to trigger only the related build jobs
  changes:
    runs-on: ubuntu-latest
    outputs:
      apache: ${{ steps.filter.outputs.apache }}
      carma_cloud_bridge: ${{ steps.filter.outputs.carma_cloud_bridge }}
      kafka_bridge: ${{ steps.filter.outputs.kafka_bridge }}
      carma_vehicle_bridge: ${{ steps.filter.outputs.carma_vehicle_bridge }}
      historical_data: ${{ steps.filter.outputs.historical_data }}
      grafana: ${{ steps.filter.outputs.grafana }}
      cloud_messaging: ${{ steps.filter.outputs.cloud_messaging }}
      rsu_management: ${{ steps.filter.outputs.rsu_management }}
      web_client: ${{ steps.filter.outputs.web_client }}
      web_server: ${{ steps.filter.outputs.web_server }}
    steps:
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            apache:
              - 'telematic_system/telematic_apps/apache2/**'
            carma_cloud_bridge:
              - 'telematic_system/telematic_units/carma_cloud_bridge/**'
            kafka_bridge:
              - 'telematic_system/telematic_units/kafka_bridge/**'
            carma_vehicle_bridge:
              - 'telematic_system/telematic_units/carma_vehicle_bridge/**'
            historical_data:
              - 'telematic_system/telematic_historical_data_processing/**'
            grafana:
              - 'telematic_system/telematic_apps/grafana/**'
            cloud_messaging:
              - 'telematic_system/telematic_cloud_messaging/**'
            rsu_management:
              - 'telematic_system/telematic_rsu_management_service/**'
            web_client:
              - 'telematic_system/telematic_apps/web_app/client/**'
            web_server:
              - 'telematic_system/telematic_apps/web_app/server/**'

  telematic-apache:
    needs: [determine_docker_org_and_tag, changes]
    if: ${{ github.event.pull_request.base.ref == 'master' || needs.changes.outputs.apache == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      # Build PR image locally so Docker Scout can scan it
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: ./telematic_system/telematic_apps/apache2/
          file: ./telematic_system/telematic_apps/apache2/Dockerfile
          load: true
          tags: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/telematic_apache2:pr-${{ github.event.pull_request.number }}
      # Compare PR image against the base branch env on Docker Scout and post results to the PR
      - name: Docker Scout Compare telematic-apache
        uses: docker/scout-action@v1.12.0
        with:
          command: compare
          image: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/telematic_apache2:pr-${{ github.event.pull_request.number }}
          to-env: ${{ needs.determine_docker_org_and_tag.outputs.docker_image_tag }}
          ignore-unchanged: true              # only show CVEs introduced by this PR
          only-severities: critical,high      # ignore low/medium noise
          organization: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          keep-previous-comments: true        # replace prior Scout comment on each push

      - name: Docker Scout Policy Evaluation telematic-apache
        uses: docker/scout-action@v1.24.0
        with:
          command: policy
          image: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}/telematic_apache2:pr-${{ github.event.pull_request.number }}
          organization: ${{ needs.determine_docker_org_and_tag.outputs.docker_organization }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
