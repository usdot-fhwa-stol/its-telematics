---
# Base host provisioning: container toolchain and rootless Docker access for the deployment user.
- name: Install container toolchain
  hosts: all
  become: true
  vars:
    # Compose v2 release supporting Ubuntu 22.04 and newer (static binary, glibc independent).
    docker_compose_version: v2.29.7
    deployment_user: "{{ ansible_user | default(ansible_user_id) }}"
    # Host directories bind-mounted by the compose files; created once so deployment needs no sudo.
    bind_mount_directories:
      - /opt/telematics
      - /opt/telematics/upload
      - /opt/telematics/logs
      - /opt/grafana
      - /opt/grafana/logs
      - /opt/grafana/data
      - /opt/grafana/provisioning
      - /opt/apache2
      - /opt/influxdb2
      - /opt/influxdb2/data
  tasks:
    # Docker CE (Docker's own apt repository) conflicts with Ubuntu's docker.io: its containerd.io
    # package conflicts with Ubuntu's containerd. A host that already has Docker CE keeps it.
    - name: Check for Docker CE
      ansible.builtin.command: dpkg-query -W -f=${Status} docker-ce
      register: docker_ce
      changed_when: false
      failed_when: false

    - name: Install Docker and system transport libraries
      ansible.builtin.apt:
        name: "{{ ([] if docker_ce_installed else ['docker.io']) + ['ca-certificates', 'curl', 'gnupg', 'apt-transport-https'] }}"
        state: present
        update_cache: true
        cache_valid_time: 3600
      vars:
        docker_ce_installed: "{{ docker_ce.rc == 0 and 'install ok installed' in docker_ce.stdout }}"
      register: base_packages
      retries: 5
      delay: 15
      until: base_packages is succeeded

    - name: Create the Docker CLI plugin directory
      ansible.builtin.file:
        path: /usr/local/lib/docker/cli-plugins
        state: directory
        mode: "0755"

    # Pinned upstream binary: apt package names for Compose differ across Ubuntu releases.
    - name: Install the pinned Docker Compose v2 plugin
      ansible.builtin.get_url:
        url: "https://github.com/docker/compose/releases/download/{{ docker_compose_version }}/docker-compose-linux-{{ ansible_architecture }}"
        dest: /usr/local/lib/docker/cli-plugins/docker-compose
        mode: "0755"
        force: false
      register: compose_download
      retries: 5
      delay: 15
      until: compose_download is succeeded

    - name: Ensure the Docker daemon is running
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Allow the deployment user to run Docker without sudo
      ansible.builtin.user:
        name: "{{ deployment_user }}"
        groups: docker
        append: true

    - name: Create bind-mount directories owned by the deployment user
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ deployment_user }}"
        mode: "0777"
      loop: "{{ bind_mount_directories }}"

    - name: Create the Grafana htpasswd file mounted by the web app
      ansible.builtin.file:
        path: /opt/apache2/grafana_htpasswd
        state: touch
        owner: "{{ deployment_user }}"
        mode: "0666"
        modification_time: preserve
        access_time: preserve

    - name: Apply the new group membership to the current connection
      ansible.builtin.meta: reset_connection
