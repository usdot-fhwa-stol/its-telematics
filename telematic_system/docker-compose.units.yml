version: "3.4"
services:
  ros2_nats_bridge:
    build:
          context: ./telematic_units/carma_vehicle_bridge
          dockerfile: Dockerfile
    image: ${DOCKER_ORG}/carma_vehicle_nats_bridge:${DOCKER_TAG}
    logging:
      options:
        max-size: "2g"
        max-file: "1"
    container_name: ros2_nats_bridge
    network_mode: host
    entrypoint: /ws/ros_entrypoint.sh
    volumes:
           - ./logs:/var/logs
    environment:
    # NATS (shared) -> vehicle bridge name
    - NATS_SERVER_IP_PORT=${NATS_URL}
    # Unit identity
    - VEHICLE_BRIDGE_UNIT_ID=${VEHICLE_BRIDGE_UNIT_ID}
    - VEHICLE_BRIDGE_UNIT_TYPE=${VEHICLE_BRIDGE_UNIT_TYPE}
    - VEHICLE_BRIDGE_UNIT_NAME=${VEHICLE_BRIDGE_UNIT_NAME}
    # Logging
    - VEHICLE_BRIDGE_LOG_LEVEL=${VEHICLE_BRIDGE_LOG_LEVEL}
    - VEHICLE_BRIDGE_LOG_NAME=${VEHICLE_BRIDGE_LOG_NAME}
    - VEHICLE_BRIDGE_LOG_PATH=${VEHICLE_BRIDGE_LOG_PATH}
    - VEHICLE_BRIDGE_LOG_ROTATION_SIZE_BYTES=${VEHICLE_BRIDGE_LOG_ROTATION_SIZE_BYTES}
    - VEHICLE_BRIDGE_LOG_HANDLER_TYPE=${VEHICLE_BRIDGE_LOG_HANDLER_TYPE} #console: Print logs on console; file: Save logs to file; all: Prints logs on console and file
    # Topic exclusion list -> vehicle bridge name
    - VEHICLE_BRIDGE_EXCLUSION_LIST=${ROS2_TOPIC_EXCLUSION_LIST} #OPTIONAL variable to set a comma separated list of topics not available to publish, leave empty if none
    # No counterpart in telematic.env
    - CYCLONE_URL=${CYCLONE_URL:-./telematic_units/cyclone_config.xml}
    - IS_SIM=${IS_SIM:-False} #OPTIONAL variable to treat incoming messages as coming from simulation env.  In this case the bridge will use system time as message timestamp. Defaults to False.

  kafka_nats_bridge:
    build:
          context: ./telematic_units/kafka_bridge
          dockerfile: Dockerfile
    image: ${DOCKER_ORG}/telematics-kafka-nats-bridge:${DOCKER_TAG}
    logging:
      options:
        max-size: "2g"
        max-file: "1"
    container_name: kafka_nats_bridge
    network_mode: host
    volumes:
           - ./logs:/var/logs
    environment:
    # NATS (shared) -> kafka bridge name
    - NATS_SERVER_IP_PORT=${NATS_URL}
    # Unit identity
    - KAFKA_BRIDGE_UNIT_ID=${KAFKA_BRIDGE_UNIT_ID}
    - KAFKA_BRIDGE_UNIT_TYPE=${KAFKA_BRIDGE_UNIT_TYPE}
    # Logging
    - KAFKA_BRIDGE_LOG_LEVEL=${KAFKA_BRIDGE_LOG_LEVEL}
    - KAFKA_BRIDGE_LOG_NAME=${KAFKA_BRIDGE_LOG_NAME}
    - KAFKA_BRIDGE_LOG_PATH=${KAFKA_BRIDGE_LOG_PATH}
    - KAFKA_BRIDGE_LOG_ROTATION_SIZE_BYTES=${KAFKA_BRIDGE_LOG_ROTATION_SIZE_BYTES}
    - KAFKA_BRIDGE_LOG_HANDLER_TYPE=${KAFKA_BRIDGE_LOG_HANDLER_TYPE} #console: Print logs on console; file: Save logs to file; all: Prints logs on console and file
    # Kafka broker
    - KAFKA_BROKER_IP=${KAFKA_BROKER_IP}
    - KAFKA_BROKER_PORT=${KAFKA_BROKER_PORT}
    - KAFKA_CONSUMER_RESET=${KAFKA_CONSUMER_RESET}
    - KAFKA_BRIDGE_EXCLUSION_LIST=${KAFKA_BRIDGE_EXCLUSION_LIST} #OPTIONAL variable to set a comma separated list of topics not available to publish, leave empty if none
    # No counterpart in telematic.env
    - KAFKA_BRIDGE_UNIT_NAME=${KAFKA_BRIDGE_UNIT_NAME:-West Intersection}
    - KAFKA_MAX_RETRIES=${KAFKA_MAX_RETRIES:-5} #Max retries to start Kafka consumer
    - KAFKA_RETRY_BASE_DELAY_SECONDS=${KAFKA_RETRY_BASE_DELAY_SECONDS:-1.0} #Exponential backoff base delay for Kafka startup
    - NATS_RECONNECT_TIME_WAIT_SECONDS=${NATS_RECONNECT_TIME_WAIT_SECONDS:-1.0} #Seconds between reconnect attempts
    - NATS_MAX_RECONNECT_ATTEMPTS=${NATS_MAX_RECONNECT_ATTEMPTS:-30} #Set to -1 for infinite reconnect attempts
    - NATS_REGISTRATION_MAX_RETRIES=${NATS_REGISTRATION_MAX_RETRIES:-5} #Set to -1 for infinite retries
    - NATS_PUBLISH_MAX_RETRIES=${NATS_PUBLISH_MAX_RETRIES:-3} #Max retries for NATS publish
    - NATS_PUBLISH_RETRY_BASE_DELAY_SECONDS=${NATS_PUBLISH_RETRY_BASE_DELAY_SECONDS:-0.2} #Exponential backoff base delay
    - NATS_FAILED_PUBLISH_BUFFER_MAX_MESSAGES=${NATS_FAILED_PUBLISH_BUFFER_MAX_MESSAGES:-100} #Maximum number of failed NATS publishes kept in memory for diagnostics before oldest entries are dropped
    - IS_SIM=${IS_SIM:-False} #OPTIONAL variable to treat incoming messages as coming from simulation env.  In this case the bridge will use system time as message timestamp. Defaults to False.

  cloud_nats_bridge:
    build:
          context: ./telematic_units/carma_cloud_bridge
          dockerfile: Dockerfile
    image: ${DOCKER_ORG}/carma_cloud_nats_bridge:${DOCKER_TAG}
    logging:
      options:
        max-size: "2g"
        max-file: "1"
    container_name: cloud_nats_bridge
    network_mode: host
    volumes:
           - ./logs:/var/logs
           - /opt/tomcat/logs:/opt/tomcat/logs
    environment:
      # NATS (shared) -> cloud bridge name
      - NATS_SERVER_IP_PORT=${NATS_URL}
      # CARMA Cloud log source
      - CARMA_CLOUD_LOG=${CARMA_CLOUD_LOG} #Required for carma cloud bridge, containing the directory where carma cloud log is located
      # Unit identity
      - CARMA_CLOUD_BRIDGE_UNIT_ID=${CARMA_CLOUD_BRIDGE_UNIT_ID}
      - CARMA_CLOUD_BRIDGE_UNIT_TYPE=${CARMA_CLOUD_BRIDGE_UNIT_TYPE}
      # Logging
      - CARMA_CLOUD_BRIDGE_LOG_LEVEL=${CARMA_CLOUD_BRIDGE_LOG_LEVEL}
      - CARMA_CLOUD_BRIDGE_LOG_NAME=${CARMA_CLOUD_BRIDGE_LOG_NAME}
      - CARMA_CLOUD_BRIDGE_LOG_PATH=${CARMA_CLOUD_BRIDGE_LOG_PATH}
      - CARMA_CLOUD_BRIDGE_LOG_ROTATION_SIZE_BYTES=${CARMA_CLOUD_BRIDGE_LOG_ROTATION_SIZE_BYTES}
      - CARMA_CLOUD_BRIDGE_LOG_HANDLER=${CARMA_CLOUD_BRIDGE_LOG_HANDLER} #"console": Print logs on console; "file": Save logs to file; "all": Prints logs on console and file
      # Message strings to search for in the carma cloud log
      - CARMA_CLOUD_BRIDGE_TCR_STRING=${CARMA_CLOUD_BRIDGE_TCR_STRING} #TCR string to search for in carma cloud log
      - CARMA_CLOUD_BRIDGE_TCM_STRING=${CARMA_CLOUD_BRIDGE_TCM_STRING} #TCM string to search for in carma cloud log
      # Topic exclusion list
      - CLOUD_BRIDGE_EXCLUSION_LIST=${CLOUD_BRIDGE_EXCLUSION_LIST} #OPTIONAL variable to set a comma separated list of topics not available to publish, leave empty if none
