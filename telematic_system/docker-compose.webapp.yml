version: "3"
services:
  web_server:
      build:
        context: "./telematic_apps/web_app/server"
      restart: always
      container_name: web_server
      image: ${DOCKER_ORG}/telematic_web_server:${DOCKER_TAG}
      logging:
        options:
          max-size: "10m"
          max-file: "1"
      network_mode: host
      environment:
        - NODE_ENV=development
        - CHOKIDAR_USEPOLLING=true
        - ALLOW_CLIENT_URL=https://cav-telematics.com,http://localhost
        - GRAFANA_HTPASSWORD=/opt/apache2/grafana_htpasswd
        - SESSION_TIMEOUT=3600
        - SECRET=my_secret_telematic_ui
        # Server port
        - PORT=9010
        # MYSQL DB credentials. Need to be replaced with actual MYSQL DB during deployment
        - DB_HOST=${MYSQL_HOST}
        - DB_USER=${MYSQL_USER}
        - DB_PASSWORD_FILE=/run/secrets/mysql_password
        - GRAFANA_DB=${MYSQL_DATABASE}
        # File upload service settings
        - UPLOAD_DESTINATION=s3
        - UPLOAD_DESTINATION_PATH=/opt/telematics/upload
        - AWS_ACCESS_KEY_ID=
        - AWS_SECRET_KEY=
        - S3_BUCKET=
        - S3_REGION=us-east-2
        - UPLOAD_HTTP_PORT=9011
        - UPLOAD_TIME_OUT=3600000 # Milliseconds
        - UPLOAD_MAX_FILE_SIZE=21474836480 #20 GB
        - CONCURRENT_QUEUE_SIZE=5
        - PART_SIZE=10485760
        - NATS_SERVERS=${NATS_SERVER_IP_PORT}
        - FILE_PROCESSING_SUBJECT=ui.file.processing
        - FILE_EXTENSIONS=.mcap
      command: bash -c '/app/service.sh'
      secrets:
        - mysql_password
      volumes:
        - /opt/apache2/grafana_htpasswd:/opt/apache2/grafana_htpasswd
        - /opt/telematics/upload:/opt/telematics/upload

  web_client:
    build:
      context: "./telematic_apps/web_app/client"
    image: ${DOCKER_ORG}/telematic_web_client:${DOCKER_TAG}
    restart: always
    container_name: web_client
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    network_mode: host
    depends_on:
      - web_server
    volumes:
      - ./env.js:/usr/share/nginx/html/env.js

  apache2:
    build:
      context: "./telematic_apps/apache2"
    restart: always
    image: ${DOCKER_ORG}/telematic_apache2:${DOCKER_TAG}
    container_name: apache2
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    network_mode: host
    environment:
      - CLIENT_LOCAL_URL=http://127.0.0.1:8082/
      - GRAFANA_LOCAL_URL=http://127.0.0.1:3000/
      - TOPICSERVICE_LOCAL_URL=<http://telematic-cloud-messaging-server-private-url:8080/>
      - UISERVICE_LOCAL_URL=http://127.0.0.1:9010/
      - UISERVICE_LOCAL_UPLOAD_URL=http://127.0.0.1:9011/
    depends_on:
      - grafana
      - web_client
      - web_server
    volumes:
      - /opt/apache2/grafana_htpasswd:/etc/apache2/grafana_htpasswd

  grafana:
    build:
      context: "./telematic_apps/grafana"
    image: ${DOCKER_ORG}/telematic_grafana:${DOCKER_TAG}
    restart: always
    container_name: grafana
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    network_mode: host
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_SECURITY_SECRET_KEY__FILE=/run/secrets/grafana_secret_key
      - GF_DATABASE_TYPE=mysql
      - GF_DATABASE_HOST=${MYSQL_HOST}:${MYSQL_PORT}
      - GF_DATABASE_NAME=${MYSQL_DATABASE}
      - GF_DATABASE_USER=${MYSQL_USER}
      - GF_DATABASE_PASSWORD__FILE=/run/secrets/mysql_password
    secrets:
        - mysql_password
        - grafana_secret_key
    volumes:
      - /opt/grafana/logs:/var/log/grafana
      - ./telematic_apps/grafana/grafana.ini:/etc/grafana/grafana.ini
      - /opt/grafana/data:/var/lib/grafana
      - /opt/grafana/provisioning:/home/grafana/conf/provisioning
      - /home/ubuntu/.aws/credentials:/usr/share/grafana/.aws/credentials
    user: "472" #grafana user id


secrets:
  mysql_password:
      file: ./secrets/mysql_password.txt
  grafana_secret_key:
    file: ./secrets/grafana_secret_key.txt