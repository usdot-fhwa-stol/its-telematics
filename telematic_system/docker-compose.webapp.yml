version: "3"

# Every service below receives its variables through an explicit `environment:` block.
# The left-hand name is the variable the service's own code reads; the ${...} on the
# right is the shared name defined in telematic.env (copied to .env during deployment).
# This file is the only remapping layer - the applications are untouched.

services:
  web_server:
      build:
        context: "./telematic_apps/web_app/server"
      restart: always
      container_name: web_server
      image: ${DOCKER_ORG}/telematic_web_server:${DOCKER_TAG}
      logging:
        options:
          max-size: "10m"
          max-file: "1"
      network_mode: host
      environment:
        - NODE_ENV=development
        - CHOKIDAR_USEPOLLING=true
        # Server
        - PORT=${PORT}
        - ALLOW_CLIENT_URL=${ALLOW_CLIENT_URL}
        # Security
        - GRAFANA_HTPASSWORD=${GRAFANA_HTPASSWORD}
        - SESSION_TIMEOUT=${SESSION_TIMEOUT}
        - SECRET=${SECRET}
        # MySQL (shared) -> web server names
        - DB_HOST=${MYSQL_HOST}
        - DB_PORT=${MYSQL_PORT}
        - DB_USER=${MYSQL_USER}
        - DB_PASSWORD=${MYSQL_PASSWORD}
        - GRAFANA_DB=${MYSQL_DATABASE}
        # NATS (shared) -> web server name
        - NATS_SERVERS=${NATS_URL}
        - FILE_PROCESSING_SUBJECT=${FILE_PROCESSING_SUBJECT}
        # RSU Management Service client
        - RSU_MANAGEMENT_SERVICE_URL=${RSU_MANAGEMENT_SERVICE_URL}
        # File upload service
        - UPLOAD_DESTINATION=${UPLOAD_DESTINATION}
        - UPLOAD_DESTINATION_PATH=${UPLOAD_DESTINATION_PATH}
        - UPLOAD_HTTP_PORT=${UPLOAD_HTTP_PORT}
        - UPLOAD_TIME_OUT=${UPLOAD_TIME_OUT}
        - UPLOAD_MAX_FILE_SIZE=${UPLOAD_MAX_FILE_SIZE}
        - CONCURRENT_QUEUE_SIZE=${CONCURRENT_QUEUE_SIZE}
        - PART_SIZE=${PART_SIZE}
        - FILE_EXTENSIONS=${FILE_EXTENSIONS}
        # S3 bucket credentials (only read when UPLOAD_DESTINATION=s3)
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
        - AWS_SECRET_KEY=${AWS_SECRET_KEY}
        - S3_BUCKET=${S3_BUCKET}
        - S3_REGION=${S3_REGION}
      command: bash -c '/app/service.sh'
      volumes:
        - /opt/apache2/grafana_htpasswd:/opt/apache2/grafana_htpasswd
        - /opt/telematics/upload:/opt/telematics/upload

  web_client:
    build:
      context: "./telematic_apps/web_app/client"
    image: ${DOCKER_ORG}/telematic_web_client:${DOCKER_TAG}
    restart: always
    container_name: web_client
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    network_mode: host
    depends_on:
      - web_server
    volumes:
      - ./env.js:/usr/share/nginx/html/env.js

  apache2:
    build:
      context: "./telematic_apps/apache2"
    restart: always
    image: ${DOCKER_ORG}/telematic_apache2:${DOCKER_TAG}
    container_name: apache2
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    network_mode: host
    environment:
      # Reverse-proxy targets - deployment specific, no counterpart in telematic.env.
      - CLIENT_LOCAL_URL=http://127.0.0.1:8082/
      - GRAFANA_LOCAL_URL=http://127.0.0.1:3000/
      - TOPICSERVICE_LOCAL_URL=<http://telematic-cloud-messaging-server-private-url:8080/>
      - UISERVICE_LOCAL_URL=http://127.0.0.1:9010/
      - UISERVICE_LOCAL_UPLOAD_URL=http://127.0.0.1:9011/
    depends_on:
      - grafana
      - web_client
      - web_server
    volumes:
      - /opt/apache2/grafana_htpasswd:/etc/apache2/grafana_htpasswd

  grafana:
    build:
      context: "./telematic_apps/grafana"
    image: ${DOCKER_ORG}/telematic_grafana:${DOCKER_TAG}
    restart: always
    container_name: grafana
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    network_mode: host
    volumes:
      - /opt/grafana/logs:/var/log/grafana
      - ./telematic_apps/grafana/grafana.ini:/etc/grafana/grafana.ini
      - /opt/grafana/data:/var/lib/grafana
      - /opt/grafana/provisioning:/home/grafana/conf/provisioning
      - /home/ubuntu/.aws/credentials:/usr/share/grafana/.aws/credentials
    user: "472" #grafana user id
