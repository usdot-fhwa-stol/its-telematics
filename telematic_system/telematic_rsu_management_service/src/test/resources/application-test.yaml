spring:
  datasource:
    url: jdbc:h2:mem:telematic-test;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate.dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  sql:
    init:
      mode: never

messaging:
  nats:
    enabled: false
    
logging:
  level:
    org.springframework: INFO
