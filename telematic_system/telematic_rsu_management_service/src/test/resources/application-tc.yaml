spring:
  datasource:
    # values will be provided by Testcontainers via DynamicPropertySource
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: none

messaging:
  nats:
    enabled: true

logging:
  level:
    org.springframework: INFO
