version: "3"
services:

  influxdb:
    image:  influxdb:latest
    profiles:
      - default
    container_name: influxdb
    ports:
      - '8086:8086'
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    environment:
      - DOCKER_INFLUXDB_INIT_CLI_CONFIG_NAME=${DOCKER_INFLUXDB_INIT_CLI_CONFIG_NAME}
      - DOCKER_INFLUXDB_INIT_MODE=${DOCKER_INFLUXDB_INIT_MODE}
      - DOCKER_INFLUXDB_INIT_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME}
      - DOCKER_INFLUXDB_INIT_PASSWORD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - DOCKER_INFLUXDB_INIT_ORG=${DOCKER_INFLUXDB_INIT_ORG}
      - DOCKER_INFLUXDB_INIT_BUCKET=${DOCKER_INFLUXDB_INIT_BUCKET}
      - DOCKER_INFLUXDB_INIT_RETENTION=${DOCKER_INFLUXDB_INIT_RETENTION}
      - DOCKER_INFLUXDB_INIT_ADMIN_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
    volumes:
      - influxdb2_data:/var/lib/influxdb2 # data directory
      - influxdb2_config:/etc/influxdb2 # config directory

  influxdb3-core:
    image: influxdb:3.7.0-core
    profiles:
      - rsu_integration
    container_name: influxdb3-core
    user: "0:0"
    ports:
      - '8181:8181'
    command:
      - influxdb3
      - serve
      - --node-id=node0
      - --object-store=file
      - --data-dir=/var/lib/influxdb3/data
      - --plugin-dir=/var/lib/influxdb3/plugins
      - --admin-token-file=/run/secrets/admin.token
    restart: unless-stopped
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    secrets:
      - source: influx_admin_token
        target: /run/secrets/admin.token
    volumes:
      - influxdb3_data:/var/lib/influxdb3/data
      - influxdb3_plugins:/var/lib/influxdb3/plugins

  mysqldb:
    image: mysql:9.7.1
    profiles:
      - default
      - rsu_integration
    restart: always
    container_name: mysqldb
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD_FILE=/run/secrets/mysql_password
      - MYSQL_ROOT_PASSWORD_FILE=/run/secrets/mysql_root_password
    ports:
      - '3307:3306'  # Mapping required for CAVe-in-a-box deployment where port 3306 is used by v2xhub
    secrets:
      - mysql_password
      - mysql_root_password
    volumes:
      - mysql-datavolume:/var/lib/mysql
      - ./scripts/database/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh

  nats:
    image: 'nats:2.7.3-alpine3.15'
    profiles:
      - rsu_integration
      - default
    restart: always
    container_name: nats
    logging:
      options:
        max-size: "2g"
        max-file: "1"
    network_mode: host

  grafana:
      build:
        context: "./telematic_apps/grafana"
      image: ${DOCKER_ORG}/telematic_grafana:${DOCKER_TAG}
      profiles:
        - rsu_integration
        - default
      restart: always
      container_name: grafana
      logging:
        options:
          max-size: "10m"
          max-file: "1"
      network_mode: host
      depends_on:
        - mysqldb      
      environment:
        - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER}
        - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
        - GF_SECURITY_SECRET_KEY__FILE=/run/secrets/grafana_secret_key
        - GF_DATABASE_TYPE=mysql
        - GF_DATABASE_HOST=${MYSQL_HOST}:${MYSQL_PORT}
        - GF_DATABASE_NAME=${MYSQL_DATABASE}
        - GF_DATABASE_USER=${MYSQL_USER}
        - GF_DATABASE_PASSWORD__FILE=/run/secrets/mysql_password
      secrets:
          - mysql_password
          - grafana_secret_key
      volumes:
        - grafana_logs:/var/log/grafana
        - ./telematic_apps/grafana/grafana.ini:/etc/grafana/grafana.ini
        - grafana_data:/var/lib/grafana
        - grafana_provisioning:/home/grafana/conf/provisioning
        - ./.aws/credentials:/usr/share/grafana/.aws/credentials
      user: "472" #grafana user id

  web_server:
      build:
        context: "./telematic_apps/web_app/server"
        dockerfile: "Dockerfile"
      image: ${DOCKER_ORG}/telematic_web_server:${DOCKER_TAG}
      profiles:
        - rsu_integration
        - default
      restart: always
      container_name: web_server
      logging:
        options:
          max-size: "10m"
          max-file: "1"
      network_mode: host
      depends_on:
        - mysqldb
        - grafana
      environment:
        - NODE_ENV=development
        - CHOKIDAR_USEPOLLING=true
        - ALLOW_CLIENT_URL=${ALLOW_CLIENT_URL}
        - GRAFANA_HTPASSWORD=${GRAFANA_HTPASSWORD}
        - SESSION_TIMEOUT=${SESSION_TIMEOUT}
        - SECRET=${SECRET}
        # Server
        - PORT=${PORT}
        - ALLOW_CLIENT_URL=${ALLOW_CLIENT_URL}
        # Security
        - GRAFANA_HTPASSWORD=${GRAFANA_HTPASSWORD}
        - SESSION_TIMEOUT=${SESSION_TIMEOUT}
        - SECRET=${SECRET}
        # MySQL (shared) -> web server names
        - DB_HOST=${MYSQL_HOST}
        - DB_PORT=${MYSQL_PORT}
        - DB_USER=${MYSQL_USER}
        - DB_PASSWORD=${MYSQL_PASSWORD}
        - GRAFANA_DB=${MYSQL_DATABASE}
        # NATS (shared) -> web server name
        - NATS_SERVERS=${NATS_URL}
        - FILE_PROCESSING_SUBJECT=${FILE_PROCESSING_SUBJECT}
        # RSU Management Service client
        - RSU_MANAGEMENT_SERVICE_URL=${RSU_MANAGEMENT_SERVICE_URL}
        # File upload service
        - UPLOAD_DESTINATION=${UPLOAD_DESTINATION}
        - UPLOAD_DESTINATION_PATH=${UPLOAD_DESTINATION_PATH}
        - UPLOAD_HTTP_PORT=${UPLOAD_HTTP_PORT}
        - UPLOAD_TIME_OUT=${UPLOAD_TIME_OUT}
        - UPLOAD_MAX_FILE_SIZE=${UPLOAD_MAX_FILE_SIZE}
        - CONCURRENT_QUEUE_SIZE=${CONCURRENT_QUEUE_SIZE}
        - PART_SIZE=${PART_SIZE}
        - FILE_EXTENSIONS=${FILE_EXTENSIONS}
        # S3 bucket credentials (only read when UPLOAD_DESTINATION=s3; unset for local)
        - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
        - AWS_SECRET_KEY=${AWS_SECRET_KEY:-}
        - S3_BUCKET=${S3_BUCKET:-}
        - S3_REGION=${S3_REGION:-}
      command: bash -c 'wait-for-it localhost:3307 && wait-for-it localhost:3000 && /app/service.sh'
      volumes:
        - ./secrets/grafana_htpasswd:/opt/apache2/grafana_htpasswd
        - telematics_upload:/opt/telematics/upload
      secrets:
      - mysql_password

  web_client:
    build:
      context: "./telematic_apps/web_app/client"
    image: ${DOCKER_ORG}/telematic_web_client:${DOCKER_TAG}
    profiles:
      - rsu_integration
      - default
    restart: always
    container_name: web_client
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    network_mode: host
    depends_on:
      - web_server

  apache2:
    build:
      context: "./telematic_apps/apache2"
      dockerfile: "./local.Dockerfile"
    image: ${DOCKER_ORG}/telematic_local_apache2:${DOCKER_TAG}
    profiles:
      - rsu_integration
      - default
    restart: always
    container_name: apache2
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    network_mode: host
    environment:
      - CLIENT_LOCAL_URL=http://127.0.0.1:8082/
      - GRAFANA_LOCAL_URL=http://127.0.0.1:3000/
      - TOPICSERVICE_LOCAL_URL=http://127.0.0.1:8080/
      - UISERVICE_LOCAL_URL=http://127.0.0.1:9010/
      - UISERVICE_LOCAL_UPLOAD_URL=http://127.0.0.1:9011/
    depends_on:
      - grafana
      - web_client
      - web_server
    volumes:
      - ./secrets/grafana_htpasswd:/etc/apache2/grafana_htpasswd

  messaging_server:
    build:
      context: "./telematic_cloud_messaging"
    container_name: messaging_server
    image: ${DOCKER_ORG}/telematic_cloud_messaging:${DOCKER_TAG}
    profiles:
      - default
    depends_on:
      - nats
      - mysqldb
      - influxdb
    restart: always
    logging:
      options:
        max-size: "2g"
        max-file: "1"
    network_mode: host
    environment:
      # Logging
      - MESSAGING_LOGGING_LEVEL=${MESSAGING_LOGGING_LEVEL}
      # NATS (shared) -> messaging server name
      - MESSAGING_NATS_URI=${NATS_URL}
      - MESSAGING_NATS_MAX_RECONNECTS=${MESSAGING_NATS_MAX_RECONNECTS}
      # InfluxDB v2 (shared) -> messaging server names.
      # NatsInfluxPush builds the client URL as "http://" + URI + ":" + PORT, so URI is host only.
      - MESSAGING_INFLUX_URI=${INFLUXDB_HOST}
      - MESSAGING_INFLUX_PORT=${INFLUXDB_PORT}
      - MESSAGING_INFLUX_USERNAME=${DOCKER_INFLUXDB_INIT_USERNAME}
      - MESSAGING_INFLUX_PWD=${DOCKER_INFLUXDB_INIT_PASSWORD}
      - MESSAGING_INFLUX_ORG=${DOCKER_INFLUXDB_INIT_ORG}
      - MESSAGING_INFLUX_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
      # Influx buckets and subscription topics
      - MESSAGING_INFLUX_BUCKET_TYPE=${MESSAGING_INFLUX_BUCKET_TYPE}
      - MESSAGING_INFLUX_BUCKET_STREETS=${MESSAGING_INFLUX_BUCKET_STREETS}
      - MESSAGING_STREETS_SUBSCRIPTION_TOPIC=${MESSAGING_STREETS_SUBSCRIPTION_TOPIC}
      - MESSAGING_INFLUX_BUCKET_PLATFORM=${MESSAGING_INFLUX_BUCKET_PLATFORM}
      - MESSAGING_PLATFORM_SUBSCRIPTION_TOPIC=${MESSAGING_PLATFORM_SUBSCRIPTION_TOPIC}
      - MESSAGING_INFLUX_BUCKET_CLOUD=${MESSAGING_INFLUX_BUCKET_CLOUD}
      - MESSAGING_CLOUD_SUBSCRIPTION_TOPIC=${MESSAGING_CLOUD_SUBSCRIPTION_TOPIC}
      # Dispatchers and unit id lists
      - MESSAGING_NUMBER_TOPICS_PER_DISPATCHER=${MESSAGING_NUMBER_TOPICS_PER_DISPATCHER}
      - MESSAGING_VEHICLE_UNIT_ID_LIST=${MESSAGING_VEHICLE_UNIT_ID_LIST}
      - MESSAGING_STREETS_UNIT_ID_LIST=${MESSAGING_STREETS_UNIT_ID_LIST}
      - MESSAGING_CLOUD_UNIT_ID_LIST=${MESSAGING_CLOUD_UNIT_ID_LIST}
      # Field handling
      - MESSAGING_TO_STR_FIELDS=${MESSAGING_TO_STR_FIELDS}
      - MESSAGING_IGNORE_FIELDS=${MESSAGING_IGNORE_FIELDS}
      # Influx timeouts
      - MESSAGING_INFLUX_CONNECT_TIMEOUT=${MESSAGING_INFLUX_CONNECT_TIMEOUT}
      - MESSAGING_INFLUX_WRITE_TIMEOUT=${MESSAGING_INFLUX_WRITE_TIMEOUT}
      # MySQL (shared) -> messaging server names
      - MESSAGING_DB_DRIVER=${MESSAGING_DB_DRIVER}
      - MESSAGING_DB_URL=jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/${MYSQL_DATABASE}
      - MESSAGING_DB_USERNAME=${MYSQL_USER}
      - MESSAGING_DB_PASSWORD=${MYSQL_PASSWORD}
      - MESSAGING_DB_DIALECT=${MESSAGING_DB_DIALECT}
    command: bash -c 'wait-for-it localhost:3307 && wait-for-it localhost:4222 && wait-for-it localhost:8086 && java -jar /telematic_cloud_messaging/app.jar'

  rsu_management_service:
    build:
      context: "./telematic_rsu_management_service"
    container_name: rsu_management_service
    image: ${DOCKER_ORG}/telematic_rsu_management_service:${DOCKER_TAG}
    profiles:
      - rsu_integration
    depends_on:
      - nats
      - mysqldb
      - influxdb3-core
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "1"
    network_mode: host
    environment:
      # Server and logging
      - rsu_server_port=${rsu_server_port}
      - logging_level_com_telematic_telematic_rsu_management_service=${logging_level_com_telematic_telematic_rsu_management_service}
      # MySQL - the service owns the "rsm" database, so the URL is its own variable;
      # credentials come from the shared MySQL block.
      - rsu_spring_datasource_url=${rsu_spring_datasource_url}
      - rsu_spring_datasource_username=${MYSQL_USER}
      - rsu_spring_datasource_password=${MYSQL_PASSWORD}
      - rsu_spring_datasource_driver=${rsu_spring_datasource_driver}
      - rsu_spring_jpa_hibernate_dialect=${rsu_spring_jpa_hibernate_dialect}
      # NATS (shared) -> RSU name
      - rsu_messaging_nats_enabled=${rsu_messaging_nats_enabled}
      - rsu_messaging_nats_uri=${NATS_URL}
      # Data ingestion
      - rsu_data_ingestion_subject_prefix=${rsu_data_ingestion_subject_prefix}
      - rsu_data_ingestion_influx_remove_fields=${rsu_data_ingestion_influx_remove_fields}
      - rsu_data_ingestion_workers_per_unit_rsu_pair=${rsu_data_ingestion_workers_per_unit_rsu_pair}
      - rsu_data_ingestion_refresh_initial_delay_ms=${rsu_data_ingestion_refresh_initial_delay_ms}
      - rsu_data_ingestion_refresh_interval_ms=${rsu_data_ingestion_refresh_interval_ms}
      # InfluxDB v3 - separate instance from the shared InfluxDB v2 above, so no remap
      - rsu_data_ingestion_influx_url=${rsu_data_ingestion_influx_url}
      - rsu_data_ingestion_influx_token=${rsu_data_ingestion_influx_token}
      - rsu_data_ingestion_influx_database=${rsu_data_ingestion_influx_database}
      - rsu_influx_endpoint_configure_database=${rsu_influx_endpoint_configure_database}
      - rsu_influx_endpoint_query_sql=${rsu_influx_endpoint_query_sql}
      - rsu_influx_write_batch_size=${rsu_influx_write_batch_size}
      - rsu_influx_write_flush_interval_ms=${rsu_influx_write_flush_interval_ms}
      - rsu_influx_write_queue_capacity=${rsu_influx_write_queue_capacity}
      # Registration API
      - rsu_registration_tru_autoconfig_subject=${rsu_registration_tru_autoconfig_subject}
      - rsu_registration_tru_config_subject=${rsu_registration_tru_config_subject}
      - rsu_registration_tru_config_request_timeout=${rsu_registration_tru_config_request_timeout}
      # Health monitoring
      - rsu_monitor_rsu_health_subject=${rsu_monitor_rsu_health_subject}
      - rsu_monitor_rsu_health_health_timeout_seconds=${rsu_monitor_rsu_health_health_timeout_seconds}
      - rsu_monitor_plugin_health_subject=${rsu_monitor_plugin_health_subject}
      - rsu_monitor_plugin_health_health_timeout_seconds=${rsu_monitor_plugin_health_health_timeout_seconds}
      - rsu_monitor_unit_health_check_enabled=${rsu_monitor_unit_health_check_enabled}
      - rsu_monitor_unit_health_check_interval_ms=${rsu_monitor_unit_health_check_interval_ms}
      - rsu_monitor_unit_health_check_max_missed_heartbeats=${rsu_monitor_unit_health_check_max_missed_heartbeats}
      - rsu_health_check_unit_inactivity_multiplier=${rsu_health_check_unit_inactivity_multiplier}
      # Data selection
      - rsu_data_selection_available_topics_subject=${rsu_data_selection_available_topics_subject}
      - rsu_data_selection_available_topics_request_timeout_seconds=${rsu_data_selection_available_topics_request_timeout_seconds}
      - rsu_data_selection_confirm_topics_subject=${rsu_data_selection_confirm_topics_subject}
      - rsu_data_selection_confirm_topics_request_timeout_seconds=${rsu_data_selection_confirm_topics_request_timeout_seconds}
      # Performance metrics
      - PERF_METRICS_ENABLED=${PERF_METRICS_ENABLED}
    command: bash -c 'wait-for-it localhost:3307 && wait-for-it localhost:4222 && wait-for-it localhost:8181 && java -jar /rsu_management_service/app.jar'
    volumes:
      - telematics_logs:/workspace/logs

  rosbag2_processing_service:
    build:
          context: ./telematic_historical_data_processing
          dockerfile: Dockerfile
          network: host
    image: ${DOCKER_ORG}/telematic_historical_data_processing:${DOCKER_TAG}
    container_name: rosbag2_processing_service
    restart: always
    profiles:
      - default
    depends_on:
      - nats
      - mysqldb
      - influxdb
      - apache2
    logging:
      options:
        max-size: "2g"
        max-file: "1"
    network_mode: host
    volumes:
      - telematics_logs:/opt/telematics/logs
      - telematics_upload:/opt/telematics/upload
    environment:
      # NATS (shared) -> HPS names
      - HPS_NATS_SERVER_IP_PORT=${NATS_URL}
      - HPS_FILE_PROCESSING_SUBJECT=${FILE_PROCESSING_SUBJECT}
      # InfluxDB v2 (shared) -> HPS names.
      # config.py builds the client URL as HPS_INFLUX_IP + ":" + HPS_INFLUX_PORT, so IP is host only.
      - HPS_INFLUX_IP=${INFLUXDB_HOST}
      - HPS_INFLUX_PORT=${INFLUXDB_PORT}
      - HPS_INFLUX_ORG=${DOCKER_INFLUXDB_INIT_ORG}
      - HPS_INFLUX_TOKEN=${DOCKER_INFLUXDB_INIT_ADMIN_TOKEN}
      - HPS_INFLUX_BUCKET=${HPS_INFLUX_BUCKET}
      # MySQL (shared) -> HPS names
      - HPS_MYSQL_HOST=${MYSQL_HOST}
      - HPS_MYSQL_PORT=${MYSQL_PORT}
      - HPS_MYSQL_DB=${MYSQL_DATABASE}
      - HPS_MYSQL_USER=${MYSQL_USER}
      - HPS_MYSQL_PASSWORD=${MYSQL_PASSWORD}
      # File handling
      - HPS_UPLOAD_DESTINATION_PATH=${HPS_UPLOAD_DESTINATION_PATH}
      - HPS_ACCEPTED_FILE_EXTENSIONS=${HPS_ACCEPTED_FILE_EXTENSIONS}
      - HPS_TO_STR_FIELDS=${HPS_TO_STR_FIELDS}
      - HPS_IGNORE_FIELDS=${HPS_IGNORE_FIELDS}
      - HPS_TOPIC_EXCLUSION_LIST=${HPS_TOPIC_EXCLUSION_LIST}
      # Logging
      - HPS_LOG_LEVEL=${HPS_LOG_LEVEL}
      - HPS_LOG_NAME=${HPS_LOG_NAME}
      - HPS_LOG_PATH=${HPS_LOG_PATH}
      - HPS_LOG_ROTATION_SIZE_BYTES=${HPS_LOG_ROTATION_SIZE_BYTES}
      - HPS_LOG_HANDLER_TYPE=${HPS_LOG_HANDLER_TYPE}
    command: bash -c 'source /ws/install/setup.bash && wait-for-it 127.0.0.1:3307 -- ros2 run rosbag2_processing_service main'


secrets:
  mysql_password:
      file: ./secrets/mysql_password.txt
  mysql_root_password:
      file: ./secrets/mysql_root_password.txt
  grafana_secret_key:
    file: ./secrets/grafana_secret_key.txt
  influx_admin_token:
      file: ./secrets/influx_admin_token.txt
volumes:
  mysql-datavolume:
  influxdb3_data:
  influxdb3_plugins:
  influxdb2_data:
  influxdb2_config:
  grafana_logs:
  grafana_data:
  grafana_provisioning:
  telematics_upload:
  telematics_logs:
