# Default VirtualHost for IP-based access (mobile app)
<VirtualHost *:80>
    ServerAdmin admin@local

    # More specific routes first: Apache uses the first matching ProxyPass.
    ProxyPass /api/upload ${UISERVICE_LOCAL_UPLOAD_URL}api/upload KeepAlive=On
    ProxyPassReverse /api/upload ${UISERVICE_LOCAL_UPLOAD_URL}api/upload
    ProxyPass /requestAvailableTopics/ ${TOPICSERVICE_LOCAL_URL}requestAvailableTopics/ KeepAlive=On
    ProxyPassReverse /requestAvailableTopics/ ${TOPICSERVICE_LOCAL_URL}requestAvailableTopics/
    ProxyPass /requestSelectedTopics ${TOPICSERVICE_LOCAL_URL}requestSelectedTopics KeepAlive=On
    ProxyPassReverse /requestSelectedTopics ${TOPICSERVICE_LOCAL_URL}requestSelectedTopics

    # Route /api/* to UI service (backend handles CORS, don't add headers)
    ProxyPass /api/ ${UISERVICE_LOCAL_URL}api/ KeepAlive=On
    ProxyPassReverse /api/ ${UISERVICE_LOCAL_URL}api/

    # Grafana route with Lua-based JWT auth + Basic Auth fallback
    <Location /grafana/>
        # Lua script checks for JWT token in URL or cookie first
        LuaHookAccessChecker /etc/apache2/lua/grafana_auth.lua grafana_auth_check early

        AuthType Basic
        AuthName "Grafana Login"
        AuthBasicProvider file
        AuthUserFile /etc/apache2/grafana_htpasswd
        Require valid-user

        RewriteEngine On
        RewriteRule .* - [E=PROXY_USER:%{LA-U:REMOTE_USER},NS]
        RequestHeader set X-WEBAUTH-USER "%{PROXY_USER}e"
        RequestHeader unset Authorization
    </Location>
    ProxyPass /grafana/ ${GRAFANA_LOCAL_URL}grafana/ KeepAlive=On
    ProxyPassReverse /grafana/ ${GRAFANA_LOCAL_URL}grafana/

    # Route everything else to client
    ProxyPass / ${CLIENT_LOCAL_URL} KeepAlive=On
    ProxyPassReverse / ${CLIENT_LOCAL_URL}
</VirtualHost>

